# AgentBlackBox — full stack in one command:
#   docker compose up -d
#
# Services:
#   postgres  :5432  — PostgreSQL 16 (append-only audit events)
#   backend   :8000  — FastAPI REST API + event ingestion
#   proxy     :8080  — LLM proxy (intercepts all LLM calls)
#   dashboard :5173  — React dashboard

services:
  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: abb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: abb
      POSTGRES_PASSWORD: abb
      POSTGRES_DB: agentblackbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abb -d agentblackbox"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abb-backend
    restart: unless-stopped
    environment:
      ABB_DATABASE_URL: postgresql+asyncpg://abb:abb@postgres:5432/agentblackbox
      ABB_API_KEYS: '["dev-proxy-key", "dev-dashboard-key"]'
      ABB_CORS_ORIGINS: '["http://localhost:5173", "http://dashboard:5173"]'
      ABB_LOG_LEVEL: INFO
      ABB_DEBUG: "false"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Proxy ────────────────────────────────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: abb-proxy
    restart: unless-stopped
    environment:
      ABB_BACKEND_URL: http://backend:8000
      ABB_BACKEND_API_KEY: dev-proxy-key
      ABB_ORG_ID: default-org
      ABB_LOG_LEVEL: INFO
      ABB_PII_ENABLED: "true"
      # Upstream LLM provider URLs (defaults are public APIs)
      ABB_OPENAI_UPSTREAM: https://api.openai.com
      ABB_ANTHROPIC_UPSTREAM: https://api.anthropic.com
      ABB_GOOGLE_UPSTREAM: https://generativelanguage.googleapis.com
      ABB_OLLAMA_UPSTREAM: http://host.docker.internal:11434
      # Pass API keys from your .env file — never hardcode them here
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # for Ollama on host

  # ─── Dashboard ────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: abb-dashboard
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: ""          # empty = use Vite proxy (same-origin)
      VITE_API_KEY: dev-dashboard-key
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: abb-postgres-data
