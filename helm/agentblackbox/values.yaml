# AgentBlackBox Helm chart values
# Override with: helm install agentblackbox ./helm/agentblackbox -f my-values.yaml

# ─── Global ──────────────────────────────────────────────────────────────────
global:
  imageRegistry: ""
  imagePullSecrets: []

# ─── Proxy ───────────────────────────────────────────────────────────────────
proxy:
  replicaCount: 1
  image:
    repository: agentblackbox/proxy
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  service:
    type: ClusterIP
    port: 8080
  env:
    ABB_ORG_ID: "default-org"
    ABB_LOG_LEVEL: "INFO"
    ABB_PII_ENABLED: "true"
    ABB_METRICS_ENABLED: "true"
    ABB_OTEL_ENABLED: "false"
  # Set LLM API keys via secret (see secret.yaml)
  secretName: "agentblackbox-secrets"

# ─── Backend ─────────────────────────────────────────────────────────────────
backend:
  replicaCount: 1
  image:
    repository: agentblackbox/backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "125m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  service:
    type: ClusterIP
    port: 8000
  env:
    ABB_LOG_LEVEL: "INFO"
    ABB_DEBUG: "false"
    ABB_METRICS_ENABLED: "true"
    ABB_OTEL_ENABLED: "false"
  secretName: "agentblackbox-secrets"

# ─── Dashboard ───────────────────────────────────────────────────────────────
dashboard:
  replicaCount: 1
  image:
    repository: agentblackbox/dashboard
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: "10Gi"
    storageClass: ""   # use cluster default
  service:
    type: ClusterIP
    port: 5432
  # Credentials -- always use a K8s Secret in production
  secretName: "agentblackbox-secrets"

# ─── Ingress ─────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: agentblackbox.example.com
      paths:
        - path: /api
          pathType: Prefix
          service: backend
          port: 8000
        - path: /proxy
          pathType: Prefix
          service: proxy
          port: 8080
        - path: /
          pathType: Prefix
          service: dashboard
          port: 80
  tls: []
  #  - secretName: agentblackbox-tls
  #    hosts:
  #      - agentblackbox.example.com
