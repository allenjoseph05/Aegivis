apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentblackbox.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentblackbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - port: {{ .Values.dashboard.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "agentblackbox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
