apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agentblackbox.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentblackbox.labels" . | nindent 4 }}
data:
  # Proxy configuration
  ABB_ORG_ID: {{ .Values.proxy.env.ABB_ORG_ID | quote }}
  ABB_LOG_LEVEL: {{ .Values.proxy.env.ABB_LOG_LEVEL | quote }}
  ABB_PII_ENABLED: {{ .Values.proxy.env.ABB_PII_ENABLED | quote }}
  ABB_METRICS_ENABLED: {{ .Values.proxy.env.ABB_METRICS_ENABLED | quote }}
  ABB_OTEL_ENABLED: {{ .Values.proxy.env.ABB_OTEL_ENABLED | quote }}
  ABB_BACKEND_URL: {{ printf "http://%s-backend:%d" (include "agentblackbox.fullname" .) (.Values.backend.service.port | int) | quote }}
  # Backend configuration
  ABB_CORS_ORIGINS: {{ printf "[\"http://%s-dashboard:%d\"]" (include "agentblackbox.fullname" .) (.Values.dashboard.service.port | int) | quote }}
