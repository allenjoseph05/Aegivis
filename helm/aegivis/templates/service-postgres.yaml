apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegivis.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegivis.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: {{ .Values.postgres.service.type }}
  clusterIP: None  # Headless for StatefulSet DNS
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    {{- include "aegivis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
