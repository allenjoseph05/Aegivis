apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegivis.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegivis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegivis.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "aegivis.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: POSTGRES_PASSWORD
            - name: AEGIVIS_DATABASE_URL
              value: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@{{ include "aegivis.fullname" . }}-postgres:5432/aegivis"
            - name: AEGIVIS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretName }}
                  key: AEGIVIS_API_KEYS
            - name: AEGIVIS_CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aegivis.fullname" . }}-config
                  key: AEGIVIS_CORS_ORIGINS
            - name: AEGIVIS_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aegivis.fullname" . }}-config
                  key: AEGIVIS_LOG_LEVEL
            - name: AEGIVIS_DEBUG
              value: {{ .Values.backend.env.AEGIVIS_DEBUG | quote }}
            - name: AEGIVIS_METRICS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aegivis.fullname" . }}-config
                  key: AEGIVIS_METRICS_ENABLED
            - name: AEGIVIS_OTEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: {{ include "aegivis.fullname" . }}-config
                  key: AEGIVIS_OTEL_ENABLED
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 8
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
