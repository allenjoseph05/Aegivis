apiVersion: v1
kind: Secret
metadata:
  name: aegivis-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegivis.labels" . | nindent 4 }}
type: Opaque
# IMPORTANT: Replace these values with real secrets.
# In production, use an external secret manager (Vault, AWS Secrets Manager, etc.)
# or generate with: helm install --set-string proxy.secretData.OPENAI_API_KEY=sk-...
stringData:
  POSTGRES_USER: "aegivis"
  POSTGRES_PASSWORD: "aegivis"
  POSTGRES_DB: "aegivis"
  AEGIVIS_BACKEND_API_KEY: "dev-proxy-key"
  AEGIVIS_API_KEYS: '["dev-proxy-key","dev-dashboard-key"]'
  VITE_API_KEY: "dev-dashboard-key"
  # LLM provider keys -- set these in production
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
