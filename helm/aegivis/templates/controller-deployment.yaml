{{- if .Values.controller.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegivis.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegivis.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aegivis.name" . }}-controller
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "aegivis.name" . }}-controller
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "aegivis.fullname" . }}-controller
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          ports:
            - name: webhook
              containerPort: {{ .Values.controller.webhook.port }}
              protocol: TCP
          env:
            - name: AEGIVIS_CTRL_WEBHOOK_PORT
              value: {{ .Values.controller.webhook.port | quote }}
            - name: AEGIVIS_CTRL_WEBHOOK_SERVICE_NAME
              value: {{ .Values.controller.webhook.serviceName | quote }}
            - name: AEGIVIS_CTRL_WEBHOOK_SERVICE_NAMESPACE
              value: {{ .Values.controller.webhook.serviceNamespace | default .Release.Namespace | quote }}
            - name: AEGIVIS_CTRL_WEBHOOK_CONFIG_NAME
              value: {{ .Values.controller.webhook.configName | quote }}
            - name: AEGIVIS_CTRL_PROXY_IMAGE
              value: {{ .Values.controller.proxy.image | quote }}
            - name: AEGIVIS_CTRL_PROXY_IMAGE_PULL_POLICY
              value: {{ .Values.controller.proxy.imagePullPolicy | quote }}
            - name: AEGIVIS_CTRL_PROXY_PORT
              value: {{ .Values.controller.proxy.port | quote }}
            - name: AEGIVIS_CTRL_WATCH_NAMESPACE
              value: {{ .Values.controller.watchNamespace | quote }}
            - name: AEGIVIS_CTRL_CERT_DIR
              value: /certs
            {{- range $k, $v := .Values.controller.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: AEGIVIS_CTRL_BACKEND_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.secretName }}
                  key: BACKEND_URL
                  optional: true
            - name: AEGIVIS_CTRL_BACKEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.controller.secretName }}
                  key: BACKEND_API_KEY
                  optional: true
          volumeMounts:
            - name: certs
              mountPath: /certs
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: webhook
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: certs
          emptyDir: {}
{{- end }}
