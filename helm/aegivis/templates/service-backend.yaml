apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegivis.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aegivis.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "aegivis.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
