---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentsecuritypolicies.aegivis.io
  annotations:
    controller-gen.kubebuilder.io/version: v0.14.0
spec:
  group: aegivis.io
  names:
    kind: AgentSecurityPolicy
    listKind: AgentSecurityPolicyList
    plural: agentsecuritypolicies
    singular: agentsecuritypolicy
    shortNames:
      - asp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Inject
          type: string
          jsonPath: .spec.inject
          description: Whether sidecar injection is enabled
        - name: EgressMode
          type: string
          jsonPath: .spec.egress.mode
          description: Egress enforcement mode
        - name: Status
          type: string
          jsonPath: .status.conditions[0].reason
          description: Reconciliation status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: AgentSecurityPolicy defines the security policy for AI agent pods.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              description: AgentSecurityPolicySpec defines the desired security posture.
              properties:
                inject:
                  type: boolean
                  default: true
                  description: |
                    Whether to inject the Aegivis proxy sidecar into matching pods.
                    When false, the controller allows the pod but does not inject.
                selector:
                  type: object
                  description: |
                    Label selector to match pods in the same namespace.
                    Empty matchLabels matches all pods in the namespace.
                  properties:
                    matchLabels:
                      type: object
                      additionalProperties:
                        type: string
                      description: Key/value pairs that must all appear in pod labels.
                proxy:
                  type: object
                  description: Configuration for the injected proxy sidecar.
                  properties:
                    image:
                      type: string
                      description: Docker image for the proxy sidecar (overrides controller default).
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                      default: 8080
                      description: Port the proxy listens on inside the pod.
                    resources:
                      type: object
                      description: Resource requests and limits for the sidecar container.
                      properties:
                        requests:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                        limits:
                          type: object
                          properties:
                            cpu:
                              type: string
                            memory:
                              type: string
                egress:
                  type: object
                  description: |
                    Egress enforcement settings. Controls what network traffic the pod is
                    allowed to send (via CNI NetworkPolicy — coarse IP-level).
                    Fine-grained hostname enforcement is handled by the proxy sidecar.
                  properties:
                    mode:
                      type: string
                      enum:
                        - allowlist
                        - audit
                        - "off"
                      default: audit
                      description: |
                        allowlist: restrict to DNS + HTTPS + backend (proxy enforces destinations).
                        audit: allow all egress but log via proxy.
                        off: no NetworkPolicy applied.
                    allowedDestinations:
                      type: array
                      description: |
                        Hostname allowlist enforced by the proxy sidecar (not the NetworkPolicy).
                        Each entry is a hostname or glob (e.g. "api.openai.com", "*.anthropic.com").
                      items:
                        type: string
            status:
              type: object
              description: AgentSecurityPolicyStatus reflects the observed state.
              properties:
                networkPolicyName:
                  type: string
                  description: Name of the owned NetworkPolicy (empty if egress.mode=off).
                lastReconcileTime:
                  type: string
                  format: date-time
                  description: Timestamp of the last successful reconciliation.
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - message
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
