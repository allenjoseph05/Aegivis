# Aegivis — Default Policy Rules
# These policies are applied to every AI agent session by default.
# Edit or override via AEGIVIS_POLICY_YAML env var pointing to a custom file.
#
# Actions:
#   BLOCK      - Reject the request with 403 (before forwarding to LLM)
#   ALERT      - Log warning + emit policy violation record to backend
#   RATE_LIMIT - Return 429 with Retry-After
#   LOG        - Record the event in violation log only (non-blocking)
#
# Conditions use AND logic (all conditions must be true for rule to fire).

rules:
  # ── Safety guardrails ──────────────────────────────────────────────────────

  - name: tool-call-loop-protection
    event_types: ["TOOL_CALL_START"]
    conditions:
      - field: tool_call_count
        op: gt
        value: 50
    action: BLOCK
    reason: "Agent exceeded 50 tool calls in one session — possible infinite loop. Stop and investigate."
    enabled: true

  - name: runaway-llm-call-protection
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: llm_call_count
        op: gt
        value: 100
    action: BLOCK
    reason: "Agent made more than 100 LLM calls in one session — runaway agent detected."
    enabled: true

  # ── PII detection alerts ───────────────────────────────────────────────────

  - name: pii-in-tool-output
    event_types: ["TOOL_CALL_END"]
    conditions:
      - field: pii_detected
        op: not_empty
    action: ALERT
    reason: "PII detected in tool output — verify this data should be accessible to the agent."
    enabled: true

  - name: pii-in-llm-request
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: pii_detected
        op: not_empty
    action: ALERT
    reason: "PII detected in LLM request payload — ensure data handling complies with privacy policy."
    enabled: true

  - name: sensitive-pii-types-critical
    event_types: ["LLM_CALL_START", "TOOL_CALL_START", "TOOL_CALL_END"]
    conditions:
      - field: pii_detected
        op: any_in
        value: ["US_SSN", "CREDIT_CARD", "IBAN_CODE", "MEDICAL_LICENSE", "US_PASSPORT"]
    action: ALERT
    reason: "Highly sensitive PII type detected (SSN/credit card/passport/medical ID). Immediate review required."
    enabled: true

  # ── Performance alerts ─────────────────────────────────────────────────────

  - name: high-latency-alert
    event_types: ["LLM_CALL_END"]
    conditions:
      - field: latency_ms
        op: gt
        value: 30000
    action: ALERT
    reason: "LLM call latency exceeded 30 seconds — provider may be degraded."
    enabled: true

  # ── Error monitoring ───────────────────────────────────────────────────────

  - name: provider-5xx-error
    event_types: ["SYSTEM_ERROR"]
    conditions:
      - field: http_status
        op: gte
        value: 500
    action: ALERT
    reason: "LLM provider returned a 5xx server error."
    enabled: true

  - name: provider-auth-error
    event_types: ["SYSTEM_ERROR"]
    conditions:
      - field: http_status
        op: in
        value: [401, 403]
    action: ALERT
    reason: "LLM provider authentication failed — check API key configuration."
    enabled: true

  # ── Model governance ───────────────────────────────────────────────────────

  # Uncomment and customize to enforce model allowlists:
  # - name: unapproved-model-block
  #   event_types: ["LLM_CALL_START"]
  #   conditions:
  #     - field: model
  #       op: not_in
  #       value: ["gpt-4o", "gpt-4o-mini", "claude-3-5-sonnet-20241022"]
  #   action: BLOCK
  #   reason: "Agent attempted to use an unapproved model."
  #   enabled: false

  # ── Rate limiting ──────────────────────────────────────────────────────────

  - name: long-session-warning
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: session_duration_ms
        op: gt
        value: 3600000
    action: ALERT
    reason: "Agent session has been running for more than 1 hour — verify this is expected."
    enabled: true
  # -- Security: prompt injection (Phase 3.1) --------------------------------
  # Thresholds mirror AEGIVIS_SECURITY_INJECTION_BLOCK_THRESHOLD and
  # AEGIVIS_SECURITY_INJECTION_ALERT_THRESHOLD.  Tune via env vars only.

  - name: prompt-injection-block
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: injection_score
        op: gte
        value: 0.80
    action: BLOCK
    reason: "High-confidence prompt injection detected (score >= 0.80). Request blocked before forwarding to LLM."
    enabled: true

  - name: prompt-injection-alert
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: injection_score
        op: gte
        value: 0.50
      - field: injection_score
        op: lt
        value: 0.80
    action: ALERT
    reason: "Suspicious prompt injection pattern detected (score 0.50-0.79). Request allowed but flagged for review."
    enabled: true

  - name: credential-leak-alert
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: credential_detected
        op: eq
        value: true
    action: ALERT
    reason: "Potential API key or secret detected in LLM request. Verify no credentials are being leaked to the model."
    enabled: true

  # -- Security: RCE detection (Phase 3.1) -----------------------------------
  # Fires when an agent's tool call arguments contain code that would execute
  # OS commands, shell pipelines, or dangerous Python / SQL constructs.
  # Threshold mirrors AEGIVIS_SECURITY_RCE_CONFIDENCE_THRESHOLD (default 0.70).

  - name: rce-in-tool-args
    event_types: ["TOOL_CALL_START"]
    conditions:
      - field: rce_detected
        op: eq
        value: true
    action: BLOCK
    reason: "Remote code execution pattern detected in tool call arguments. Request blocked to prevent agent-driven code injection."
    enabled: true

  # -- Security: SSRF detection (Phase 3.1) ----------------------------------
  # Two separate rules distinguish HIGH-RISK cloud-metadata endpoints (always
  # block — they serve IAM credentials) from MEDIUM-RISK private IPs (alert
  # only — enterprise agents legitimately call internal APIs on 10.x.x.x).
  #
  # To allow internal API calls, set:
  #   AEGIVIS_SECURITY_SSRF_ALLOWED_DOMAINS=myapi.internal,10.0.0.5
  # To downgrade private-IP detection to LOG, change the action below.

  - name: ssrf-cloud-metadata-block
    event_types: ["TOOL_CALL_START"]
    conditions:
      - field: ssrf_category
        op: eq
        value: "cloud_metadata"
    action: BLOCK
    reason: "Tool call targets a cloud metadata endpoint (169.254.169.254). Blocked to prevent IAM credential theft."
    enabled: true

  - name: ssrf-private-ip-alert
    event_types: ["TOOL_CALL_START"]
    conditions:
      - field: ssrf_detected
        op: eq
        value: true
      - field: ssrf_category
        op: neq
        value: "cloud_metadata"
    action: ALERT
    reason: "Tool call targets a private/internal network address. Review access — set AEGIVIS_SECURITY_SSRF_ALLOWED_DOMAINS to allow known internal APIs."
    enabled: true

  # ── Context-aware multi-turn injection detection ──────────────────────────
  # Fired by intercept.py directly (not evaluated by policy engine field match).
  # Listed here for documentation and hot-reload awareness only.
  - name: context-injection-block
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: injection_score
        op: gte
        value: 0.60
    action: BLOCK
    reason: "Multi-turn rolling injection score exceeds block threshold — Crescendo/gradual injection attack detected across session turns."
    enabled: true

  - name: context-injection-alert
    event_types: ["LLM_CALL_START"]
    conditions:
      - field: injection_score
        op: gte
        value: 0.35
    action: ALERT
    reason: "Elevated injection signal sustained across multiple turns — possible gradual injection buildup."
    enabled: true

  # ── DIRECTLY-FIRED RULES (enabled: false) ─────────────────────────────────
  # The rules below have `enabled: false` which means the policy engine DOES NOT
  # evaluate their conditions. Instead, intercept.py fires them directly when
  # the relevant invariant is violated. They appear here for documentation,
  # hot-reload tracking, and to allow custom-action overrides in derived configs.
  #
  # Directly-fired rule index:
  #   token-budget-exceeded        — state.total_tokens >= cap
  #   llm-call-budget-exceeded     — state.llm_call_count >= cap
  #   system-prompt-mutation       — system prompt hash changes mid-session
  #   spawn-depth-exceeded         — spawn_depth > AEGIVIS_MAX_SPAWN_DEPTH
  #   egress-destination-not-allowed — tool call network destination not allowlisted
  #   ifc-external-to-sink         — EXTERNAL label flows to privileged sink arg
  #   data-flow-graph-violation    — Session PDG detects multi-hop exfil chain
  #
  # ── Token budget enforcement ──────────────────────────────────────────────
  # Set AEGIVIS_RATE_LIMIT_MAX_TOKENS_PER_SESSION to a non-zero value to activate.
  # Fired by intercept.py directly when state.total_tokens >= cap.
  - name: token-budget-exceeded
    event_types: ["LLM_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "Session token budget exhausted — configure AEGIVIS_RATE_LIMIT_MAX_TOKENS_PER_SESSION to set the cap."
    enabled: false  # fired directly by intercept.py when cap > 0; empty conditions would match every call

  - name: llm-call-budget-exceeded
    event_types: ["LLM_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "Session LLM call budget exhausted — configure AEGIVIS_RATE_LIMIT_MAX_LLM_CALLS_PER_SESSION to set the cap."
    enabled: false  # fired directly by intercept.py when cap > 0; empty conditions would match every call

  # ── System prompt integrity (Phase 6) ─────────────────────────────────────
  # Fired directly by intercept.py when the system prompt hash changes
  # mid-session. Listed here for documentation and hot-reload awareness.
  - name: system-prompt-mutation
    event_types: ["LLM_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "System prompt changed mid-session — possible successful prompt injection or compromised orchestrator."
    enabled: false  # fired directly by intercept.py; conditions not evaluated by policy engine

  # ── Multi-agent spawn depth enforcement (Phase 6) ─────────────────────────
  # Fired directly by intercept.py when spawn_depth > AEGIVIS_MAX_SPAWN_DEPTH.
  # To change the limit: set AEGIVIS_MAX_SPAWN_DEPTH env var (default: 10).
  # To disable: set AEGIVIS_MAX_SPAWN_DEPTH=0.
  - name: spawn-depth-exceeded
    event_types: ["LLM_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "Agent spawn depth limit exceeded — possible runaway delegation chain or compromised orchestrator."
    enabled: false  # fired directly by intercept.py; depth configured via AEGIVIS_MAX_SPAWN_DEPTH

  # ── Hard Egress Enforcement (Phase 13) ────────────────────────────────────
  # Fired directly by intercept.py when a tool call's network destination
  # (url, endpoint, webhook_url, host, etc.) is not in the operator's
  # approved allowlist. Configure with AEGIVIS_SECURITY_EGRESS_ALLOWLIST.
  # Mode: AEGIVIS_SECURITY_EGRESS_MODE=allowlist (block) | audit (alert) | off.
  - name: egress-destination-not-allowed
    event_types: ["TOOL_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "Tool call targets a network destination not in the approved allowlist. Configure AEGIVIS_SECURITY_EGRESS_ALLOWLIST to permit known endpoints."
    enabled: false  # fired directly by intercept.py; conditions not evaluated by policy engine

  # ── IFC Label System (Phase 11) ──────────────────────────────────────────
  # Fired directly by intercept.py Hook 3-IFC when EXTERNAL-labeled content
  # flows into a privileged sink argument (url, to, command, path, etc.).
  # Deterministic: no ML, no heuristics — pure label propagation math.
  # Action (BLOCK or ALERT) controlled by AEGIVIS_SECURITY_IFC_BLOCK env var.
  # To change extra sink keys: AEGIVIS_SECURITY_IFC_EXTRA_SINK_KEYS=key1,key2
  - name: ifc-external-to-sink
    event_types: ["TOOL_CALL_START"]
    conditions: []
    action: BLOCK
    reason: "IFC: EXTERNAL-labeled content (from web/email/tool result) flowed into a privileged sink argument. Possible injection-driven exfiltration blocked."
    enabled: false  # fired directly by intercept.py Hook 3-IFC; conditions not evaluated by policy engine

  # ── Session PDG — multi-hop data exfil detection (Phase 10) ───────────────
  # Fired directly by intercept.py Hook C when the Session Program Dependence
  # Graph detects that content from an UNTRUSTED source (web_search, email_read,
  # fetch, etc.) is propagated into a sensitive sink argument in a subsequent
  # tool call. Action controlled by AEGIVIS_SECURITY_PDG_ACTION env var.
  # Mode: AEGIVIS_SECURITY_PDG_ACTION=alert (default) | block.
  - name: data-flow-graph-violation
    event_types: ["TOOL_CALL_START"]
    conditions: []
    action: ALERT
    reason: "Session PDG detected a multi-hop data flow from an untrusted source to a sensitive sink — possible injection-driven exfiltration."
    enabled: false  # fired directly by intercept.py Hook C; conditions not evaluated by policy engine
