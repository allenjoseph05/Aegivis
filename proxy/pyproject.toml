[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentblackbox-proxy"
version = "1.0.0"
description = "AgentBlackBox LLM Proxy — transparent forensic interception for any AI agent"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "audit", "compliance", "proxy", "llm", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-ulid>=2.2.0",
]

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "spacy>=3.7.0",
]
security = [
    # Optional: richer shell tokenisation for the RCE scanner.
    # Without this, structural regex analysis is used (still effective).
    "bashlex>=0.18",
    # Optional: SQL AST parsing for the RCE scanner.
    # Without this, structural pattern matching is used.
    "sqlglot>=25.0.0",
]
classifier = [
    # Async ML injection classifier (Phase 4 analysis path).
    # protectai/deberta-v3-base-prompt-injection-v2 — 88-99% PINT accuracy.
    # Model is ~280 MB and downloaded once to ~/.cache/huggingface/hub/.
    # CPU inference: ~50ms/text. Runs async after forwarding (zero hot-path latency).
    "transformers>=4.40.0",
    "torch>=2.2.0",
    # Optional: ONNX Runtime acceleration (3-5x faster on CPU).
    # Without this, standard transformers pipeline is used.
    # "optimum[onnxruntime]>=1.20.0",
]
observability = [
    # Prometheus metrics endpoint (/metrics)
    "prometheus-client>=0.21.0",
    # OpenTelemetry distributed tracing (exports to Jaeger, Tempo, etc.)
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
ml = [
    # Isolation Forest anomaly detection for behavioral analytics
    "scikit-learn>=1.5.0",
    # numpy already in security extra; explicit here for standalone install
    "numpy>=1.26.0",
]
benchmark = [
    # HuggingFace datasets library for external real-world benchmark
    "datasets>=2.20.0",
]
redis = [
    # Distributed session state (multi-proxy) + Redis Streams event pipeline.
    # Install with: pip install 'agentblackbox-proxy[redis]'
    "redis[asyncio]>=5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[project.scripts]
abb-proxy = "proxy.app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["..", "."]

[tool.hatch.build.targets.wheel]
packages = ["app"]
