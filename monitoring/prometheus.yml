global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agentblackbox-proxy"
    static_configs:
      - targets: ["proxy:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "agentblackbox-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
