name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  proxy-tests:
    name: Proxy Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install proxy dependencies
        working-directory: proxy
        run: pip install -e ".[pii,security]" pytest-cov

      - name: Run proxy tests
        working-directory: proxy
        run: |
          pytest tests/ -v --tb=short \
            --ignore=tests/test_external_datasets.py \
            --ignore=tests/test_benchmark.py \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload proxy coverage
        uses: codecov/codecov-action@v4
        with:
          file: proxy/coverage.xml
          flags: proxy
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abb
          POSTGRES_PASSWORD: abb
          POSTGRES_DB: aegivis_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]" pytest-cov

      - name: Run Alembic migrations
        working-directory: backend
        env:
          AEGIVIS_DATABASE_URL: postgresql+asyncpg://abb:abb@localhost:5432/aegivis_test
        run: alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          AEGIVIS_DATABASE_URL: postgresql+asyncpg://abb:abb@localhost:5432/aegivis_test
        run: pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload backend coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  sdk-tests:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK dependencies
        working-directory: sdk
        run: pip install -e . pytest pytest-cov

      - name: Run SDK tests
        working-directory: sdk
        run: pytest tests/ -v --tb=short --ignore=tests/test_integration.py --cov=aegivis --cov-report=xml --cov-report=term-missing

      - name: Upload SDK coverage
        uses: codecov/codecov-action@v4
        with:
          file: sdk/coverage.xml
          flags: sdk
          fail_ci_if_error: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint proxy
        working-directory: proxy
        run: ruff check app/ --select=E,F,W,I --ignore=E501

      - name: Lint backend
        working-directory: backend
        run: ruff check app/ --select=E,F,W,I --ignore=E501

      - name: Lint SDK
        working-directory: sdk
        run: ruff check aegivis/ --select=E,F,W,I --ignore=E501

  dashboard-build:
    name: Dashboard Build + Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install

      - name: Type check + lint
        working-directory: dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build proxy image
        run: docker build -t aegivis-proxy:ci proxy/

      - name: Build backend image
        run: docker build -t aegivis-backend:ci backend/

      - name: Build dashboard image
        run: docker build -t aegivis-dashboard:ci dashboard/
