[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentblackbox"
version = "1.0.0"
description = "AgentBlackBox SDK — forensic audit trail for AI agents"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "audit", "compliance", "llm", "agent", "forensics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]

[project.scripts]
agentblackbox = "agentblackbox.cli.verify:main"

[tool.hatch.build.targets.wheel]
packages = ["agentblackbox"]
