[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegivis-controller"
version = "1.0.0"
description = "Kubernetes operator + admission webhook for Aegivis AI agent security"
requires-python = ">=3.11"
dependencies = [
    "kopf>=1.37.0",
    "kubernetes>=28.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "cryptography>=42.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "respx", "httpx"]

[project.scripts]
aegivis-controller = "app.main:main"
kubectl-aegivis = "app.kubectl_plugin:cli"

[tool.hatch.build.targets.wheel]
packages = ["app"]
